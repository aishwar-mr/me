name = "mars-ask"
main = "index.js"
compatibility_date = "2026-01-01"

# Created by:  wrangler kv namespace create MARS_KV
# then paste the returned id below. Rate limiting fails closed without it,
# so the endpoint refuses to call the API until this is bound.
[[kv_namespaces]]
binding = "MARS_KV"
id = "PASTE_KV_NAMESPACE_ID_HERE"
