<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aishwar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #881946; --bg: #FFFFFF; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); font-family: "Manrope", system-ui, sans-serif; }

    .site-header {
      display: flex;
      align-items: center;
      gap: 2.5rem;
      padding: 1.1rem 2.5rem;
      background: var(--bg);
      color: var(--ink);
      border-bottom: 1px solid rgba(136, 25, 70, .12);
    }
    .brand { font-size: 1.9rem; font-weight: 700; letter-spacing: -.03em; }
    .nav, .actions { display: flex; align-items: center; gap: 1.6rem; }
    .nav { flex: 1; justify-content: center; font-size: 1.05rem; font-weight: 500; }
    .site-header a { color: inherit; text-decoration: none; }
    .nav a:hover, .icon-btn:hover { opacity: .7; }
    .icon-btn {
      display: grid; place-items: center;
      width: 1.6rem; height: 1.6rem;
      background: none; border: 0; padding: 0; color: inherit; cursor: pointer;
    }
    .icon-btn svg { width: 100%; height: 100%; }
    .cta {
      background: var(--ink); color: var(--bg);
      padding: .75rem 2.2rem; border-radius: .4rem;
      font-size: 1.05rem; font-weight: 500; white-space: nowrap;
    }
    .cta:hover { opacity: .9; }

    @media (max-width: 820px) {
      .site-header { flex-wrap: wrap; gap: 1rem; padding: 1rem 1.25rem; }
      .nav { order: 3; flex-basis: 100%; justify-content: flex-start; }
      .actions { margin-left: auto; }
      .cta { padding: .65rem 1.4rem; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <a class="brand" href="/">Aishwar</a>

  <nav class="nav">
    <a href="/our-story">Our Story</a>
    <a href="/impact-delivered">Impact Delivered</a>
    <button class="icon-btn" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
  </nav>

  <div class="actions">
    <a class="cta" href="/contact">Get in Touch</a>
    <a class="icon-btn" href="https://x.com/" aria-label="X">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 3h3.2l-7 8 8.2 10h-6.4l-5-6.1L4.7 21H1.5l7.5-8.6L1.1 3h6.6l4.5 5.6L17.5 3zm-1.1 16h1.8L7.7 4.9H5.8L16.4 19z"/></svg>
    </a>
    <a class="icon-btn" href="https://linkedin.com/" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 110 5 2.5 2.5 0 010-5zM3 9h4v12H3V9zm7 0h3.8v1.7h.05c.53-1 1.83-2.05 3.76-2.05 4.02 0 4.76 2.6 4.76 5.98V21h-4v-5.5c0-1.31-.02-3-1.85-3-1.85 0-2.13 1.44-2.13 2.9V21h-4V9z"/></svg>
    </a>
    <a class="icon-btn" href="/language" aria-label="Language">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg>
    </a>
  </div>
</header>

</body>
</html>
